---
# Pull-based stack: runs the published GHCR image instead of building the exporter.
#
#   cp .env.example .env   # then edit KEMP1_HOSTNAME / KEMP1_APIKEY
#   docker compose -f docker-compose.ghcr.yml up
#
# Pin a version with KEMP_TAG (defaults to :latest):
#   KEMP_TAG=0.1.0 docker compose -f docker-compose.ghcr.yml up
#
# Refresh images later with:  docker compose -f docker-compose.ghcr.yml pull
#
# Same caveat as docker-compose.yml: no LoadMaster ships with this stack. Until
# KEMP1_HOSTNAME / KEMP1_APIKEY in .env point at a real, reachable appliance,
# kemp_up stays 0 with no virtual-service/real-server series — the expected,
# honest state of a quickstart with nothing to scrape.
services:
  kemp_exporter:
    image: ghcr.io/fjacquet/kemp_exporter:${KEMP_TAG:-latest}
    container_name: kemp_exporter
    command: ["--config", "/etc/kemp_exporter/config.yaml"]
    ports:
      - "9448:9448"
    environment:
      - KEMP1_HOSTNAME=${KEMP1_HOSTNAME:-10.0.0.1}
      - KEMP1_APIKEY=${KEMP1_APIKEY:-replace-me}
    volumes:
      - ./config.yaml:/etc/kemp_exporter/config.yaml:ro
    # Mirrors the image's own HEALTHCHECK exactly, timeout included. 127.0.0.1,
    # never localhost -- busybox wget tries ::1 first and this exporter binds
    # IPv4 only.
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:9448/livez"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: kemp_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # kemp.rules.yml only, by name: kemp.rules.unconfirmed.yml in the same
      # directory is expected to fire until hardware confirms its wire contract.
      - ./deploy/prometheus/kemp.rules.yml:/etc/prometheus/rules/kemp.rules.yml:ro
    depends_on:
      - kemp_exporter
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: kemp_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/kemp-overview.json:/var/lib/grafana/dashboards/kemp-overview.json:ro
    depends_on:
      - prometheus
    restart: unless-stopped
